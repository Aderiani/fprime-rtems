# GR740/RTEMS Build and Test Workflow

name: GR740-RTEMS-CI

on:
  push:
    branches: [ devel, release/** ]
  pull_request:
    branches: [ devel, release/** ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/actions/spelling/**'
      - '.github/ISSUE_TEMPLATE/**'

env:
  RTEMS_PATH: /opt/rtems/rcc-1.3.2-gcc
  RTEMS_BSP: gr740
  CROSS_PREFIX: sparc-gaisler-rtems5

jobs:
  # Check if RTEMS toolchain is available
  check-toolchain:
    runs-on: ubuntu-22.04
    outputs:
      rtems-available: ${{ steps.check.outputs.available }}
    steps:
    - name: Check RTEMS Toolchain
      id: check
      run: |
        if [ -d "${{ env.RTEMS_PATH }}" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "RTEMS toolchain found at ${{ env.RTEMS_PATH }}"
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "RTEMS toolchain not found, will use container"
        fi

  # Native build for comparison and basic tests
  Framework-Native:
    runs-on: ubuntu-22.04
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: F prime Native CI step
      run: ./ci/tests/Framework.bash
    - name: 'Archive Logs'
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ci-framework-native-logs
        path: ci-logs.tar.gz
        retention-days: 5

  # GR740/RTEMS Framework build
  Framework-GR740:
    runs-on: ubuntu-22.04
    needs: check-toolchain
    container:
      # Use a container with RTEMS if not available on runner
      image: ${{ needs.check-toolchain.outputs.rtems-available == 'false' && 'gaisler/rtems5-gcc:latest' || '' }}
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    
    - name: Setup Python for RTEMS
      run: |
        if ! command -v python3 &> /dev/null; then
          apt-get update && apt-get install -y python3 python3-pip python3-venv
        fi
    
    - name: Install F´ Python Dependencies
      run: |
        python3 -m venv fprime-venv
        . fprime-venv/bin/activate
        pip install -U setuptools setuptools_scm wheel pip
        pip install -r requirements.txt
    
    - name: Setup RTEMS Environment
      run: |
        echo "RTEMS_PATH=${{ env.RTEMS_PATH }}" >> $GITHUB_ENV
        echo "PATH=${{ env.RTEMS_PATH }}/bin:$PATH" >> $GITHUB_ENV
        # Verify toolchain
        which ${{ env.CROSS_PREFIX }}-gcc || echo "Toolchain not in PATH"
    
    - name: Generate GR740 Build Cache
      run: |
        . fprime-venv/bin/activate
        fprime-util generate --verbose \
          -DCMAKE_TOOLCHAIN_FILE="${PWD}/cmake/toolchain/gr740-rtems5.cmake" \
          -DFPRIME_PLATFORM=RTEMS
    
    - name: Build Framework for GR740
      run: |
        . fprime-venv/bin/activate
        fprime-util build --all -j4
    
    - name: 'Archive Build Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: gr740-framework-build
        path: |
          build-fprime-automatic-gr740/
          !build-fprime-automatic-gr740/**/*.o
        retention-days: 5

  # GR740/RTEMS Ref Application build
  Ref-GR740:
    runs-on: ubuntu-22.04
    needs: check-toolchain
    container:
      image: ${{ needs.check-toolchain.outputs.rtems-available == 'false' && 'gaisler/rtems5-gcc:latest' || '' }}
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    
    - name: Setup Python for RTEMS
      run: |
        if ! command -v python3 &> /dev/null; then
          apt-get update && apt-get install -y python3 python3-pip python3-venv
        fi
    
    - name: Install F´ Python Dependencies
      run: |
        python3 -m venv fprime-venv
        . fprime-venv/bin/activate
        pip install -U setuptools setuptools_scm wheel pip
        pip install -r requirements.txt
    
    - name: Generate Ref Build for GR740
      working-directory: ./Ref
      run: |
        . ../fprime-venv/bin/activate
        fprime-util generate --verbose \
          -DCMAKE_TOOLCHAIN_FILE="${PWD}/../cmake/toolchain/gr740-rtems5.cmake" \
          -DFPRIME_PLATFORM=RTEMS
    
    - name: Build Ref for GR740
      working-directory: ./Ref
      run: |
        . ../fprime-venv/bin/activate
        fprime-util build -j4
    
    - name: Check Binary Info
      working-directory: ./Ref
      run: |
        ${{ env.CROSS_PREFIX }}-size build-fprime-automatic-gr740/bin/Ref.exe
        ${{ env.CROSS_PREFIX }}-objdump -h build-fprime-automatic-gr740/bin/Ref.exe | head -20
    
    - name: 'Archive Ref Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: gr740-ref-build
        path: |
          Ref/build-fprime-automatic-gr740/bin/
          Ref/build-fprime-automatic-gr740/dict/
        retention-days: 5

  # Unit tests - compile only for RTEMS
  UnitTests-GR740:
    runs-on: ubuntu-22.04
    needs: check-toolchain
    container:
      image: ${{ needs.check-toolchain.outputs.rtems-available == 'false' && 'gaisler/rtems5-gcc:latest' || '' }}
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    
    - name: Setup Python for RTEMS
      run: |
        if ! command -v python3 &> /dev/null; then
          apt-get update && apt-get install -y python3 python3-pip python3-venv
        fi
    
    - name: Install F´ Python Dependencies
      run: |
        python3 -m venv fprime-venv
        . fprime-venv/bin/activate
        pip install -U setuptools setuptools_scm wheel pip
        pip install -r requirements.txt
    
    - name: Generate UT Build for GR740
      run: |
        . fprime-venv/bin/activate
        fprime-util generate --ut --verbose \
          -DCMAKE_TOOLCHAIN_FILE="${PWD}/cmake/toolchain/gr740-rtems5.cmake" \
          -DFPRIME_PLATFORM=RTEMS
    
    - name: Build Unit Tests for GR740
      run: |
        . fprime-venv/bin/activate
        fprime-util build --ut -j4
    
    - name: List Built Tests
      run: |
        echo "Built unit test executables:"
        find build-fprime-automatic-gr740-ut -name "*.exe" -type f | sort

  # Code quality checks remain the same
  Quality:
    runs-on: ubuntu-22.04
    steps:
    - name: "Checkout F´ Repository"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: true
    - uses: ./.github/actions/setup
    - name: Setup Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install clang-tidy-12
    - name: General Static Analysis
      run: |
        fprime-util generate --ut -DCMAKE_C_COMPILER=gcc-10 -DCMAKE_CXX_COMPILER=g++-10 -DCMAKE_CXX_CLANG_TIDY=clang-tidy-12
        fprime-util build --all --ut -j4
    - name: Flight Code Static Analysis
      run: |
        fprime-util generate -DCMAKE_C_COMPILER=gcc-10 -DCMAKE_CXX_COMPILER=g++-10 -DCMAKE_CXX_CLANG_TIDY="clang-tidy-12;--config-file=$PWD/release.clang-tidy"
        fprime-util build --all -j4